<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>치즈 룰렛 · Xylem</title>
<!--
  치즈 룰렛 overlay — OBS browser source http://localhost:8080/roulette (suggested 800×900, transparent).
  Allmind decides every result and queues it; this page only animates the wheel onto that result and
  reports back when it has been shown, so a reload mid-spin replays the same spin.
  Options: ?sound=0 (no tick/chime) · ?demo=1 (spins on its own, for positioning in OBS)
-->
<style>
  html, body { margin: 0; background: transparent; overflow: hidden; height: 100%; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
const Q = new URLSearchParams(location.search);
const SOUND = Q.get('sound') !== '0';
const DEMO = Q.get('demo') === '1';
const FONT = '"Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif';
const cv = document.getElementById('c');
const g = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;
function resize() { DPR = window.devicePixelRatio || 1; W = innerWidth; H = innerHeight; cv.width = W * DPR; cv.height = H * DPR; g.setTransform(DPR, 0, 0, DPR, 0, 0); }
addEventListener('resize', resize); resize();

let cfg = { title: '치즈 룰렛', items: [], spinSec: 6, holdSec: 5 };
let queue = [];
let cur = null;      // { row, items, start, from, to, phase: 'in'|'spin'|'hold'|'out', t0 }
let rot = 0;         // current wheel rotation (rad)
let alpha = 0;       // overall visibility
const done = new Set(); // ids shown by this page (until the server confirms)

// ---------- sound (WebAudio; OBS captures browser-source audio) ----------
let ac = null;
function beep(freq, dur, vol = 0.12, type = 'triangle') {
  if (!SOUND) return;
  try {
    ac ||= new AudioContext();
    const o = ac.createOscillator(), gn = ac.createGain();
    o.type = type; o.frequency.value = freq;
    gn.gain.setValueAtTime(vol, ac.currentTime); gn.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + dur);
    o.connect(gn).connect(ac.destination); o.start(); o.stop(ac.currentTime + dur);
  } catch {}
}
const chime = () => { [660, 880, 1320].forEach((f, i) => setTimeout(() => beep(f, 0.35, 0.14, 'sine'), i * 110)); };

// ---------- wheel geometry ----------
function slices(items) {
  const total = items.reduce((a, it) => a + Math.max(0, it.weight), 0) || 1;
  let a = 0;
  return items.filter((it) => it.weight > 0).map((it) => { const span = (it.weight / total) * Math.PI * 2; const s = { ...it, a0: a, a1: a + span }; a += span; return s; });
}
const easeOut = (t) => 1 - Math.pow(1 - t, 4);

function startNext() {
  const row = queue.find((r) => !done.has(r.id));
  if (!row) return;
  let items = cfg.items.slice();
  if (!items.some((it) => it.id === row.itemId)) items.push({ id: row.itemId, name: row.result, weight: (items.reduce((a, b) => a + b.weight, 0) || 1) * 0.08, color: row.color || '#888' });
  const sl = slices(items);
  const hit = sl.find((s) => s.id === row.itemId);
  const span = hit.a1 - hit.a0;
  const at = hit.a0 + span * (0.15 + Math.random() * 0.7); // somewhere inside the slice, not on an edge
  // the pointer is at the top (-90°): rotation r puts angle `at` there when at + r ≡ -π/2
  const base = -Math.PI / 2 - at;
  const from = rot % (Math.PI * 2);
  let to = base;
  while (to < from + Math.PI * 2 * 5) to += Math.PI * 2; // at least 5 full turns
  cur = { row, sl, from, to, phase: 'in', t0: performance.now(), lastSlice: -1 };
}

function ack(id) {
  done.add(id);
  fetch('/api/roulette/shown', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id }) }).catch(() => {});
}

function tick(now) {
  if (!cur && queue.some((r) => !done.has(r.id))) startNext();
  if (cur) {
    const t = (now - cur.t0) / 1000;
    if (cur.phase === 'in') { alpha = Math.min(1, t / 0.35); if (t >= 0.35) { cur.phase = 'spin'; cur.t0 = now; } }
    else if (cur.phase === 'spin') {
      const k = Math.min(1, t / cfg.spinSec);
      rot = cur.from + (cur.to - cur.from) * easeOut(k);
      // tick on every slice boundary passing the pointer
      const at = ((-Math.PI / 2 - rot) % (Math.PI * 2) + Math.PI * 4) % (Math.PI * 2);
      const idx = cur.sl.findIndex((s) => at >= s.a0 && at < s.a1);
      if (idx !== cur.lastSlice) { if (cur.lastSlice !== -1) beep(1200, 0.04, 0.06, 'square'); cur.lastSlice = idx; }
      if (k >= 1) { cur.phase = 'hold'; cur.t0 = now; chime(); }
    } else if (cur.phase === 'hold') {
      if (t >= cfg.holdSec) { ack(cur.row.id); const more = queue.some((r) => !done.has(r.id)); cur.phase = more ? 'next' : 'out'; cur.t0 = now; }
    } else if (cur.phase === 'next') { cur = null; }
    else if (cur.phase === 'out') { alpha = Math.max(0, 1 - t / 0.5); if (t >= 0.5) cur = null; }
  }
  draw(now);
  requestAnimationFrame(tick);
}

// ---------- drawing ----------
function text(s, x, y, size, color, weight = 800, align = 'center') {
  g.font = `${weight} ${size}px ${FONT}`; g.textAlign = align; g.textBaseline = 'middle';
  g.lineJoin = 'round'; g.lineWidth = Math.max(3, size / 5); g.strokeStyle = 'rgba(5,10,12,.9)';
  g.strokeText(s, x, y); g.fillStyle = color; g.fillText(s, x, y);
}
function fit(s, max, size) { g.font = `800 ${size}px ${FONT}`; while (size > 10 && g.measureText(s).width > max) { size -= 1; g.font = `800 ${size}px ${FONT}`; } return size; }

function draw(now) {
  g.clearRect(0, 0, W, H);
  if (!cur || alpha <= 0) return;
  g.globalAlpha = alpha;
  const R = Math.min(W, H * 0.78) * 0.42;
  const cx = W / 2, cy = H * 0.46;
  // title
  const row = cur.row;
  const head = `${row.nick}${row.of > 1 ? `  ·  ${row.idx}/${row.of}` : ''}`;
  text(cfg.title, cx, cy - R - 64, Math.max(18, R * 0.12), '#ffd34d', 900);
  text(head, cx, cy - R - 26, fit(head, W * 0.9, Math.max(16, R * 0.11)), '#ffffff', 800);
  // wheel
  g.save(); g.translate(cx, cy); g.rotate(rot);
  for (const s of cur.sl) {
    g.beginPath(); g.moveTo(0, 0); g.arc(0, 0, R, s.a0, s.a1); g.closePath();
    g.fillStyle = s.color; g.fill();
    g.strokeStyle = 'rgba(5,10,12,.55)'; g.lineWidth = 2; g.stroke();
    // label along the slice's middle
    const mid = (s.a0 + s.a1) / 2, span = s.a1 - s.a0;
    if (span > 0.12) {
      g.save(); g.rotate(mid);
      const size = Math.min(R * 0.1, Math.max(11, span * R * 0.32));
      g.font = `800 ${size}px ${FONT}`; g.textAlign = 'right'; g.textBaseline = 'middle';
      let label = s.name; while (label.length > 1 && g.measureText(label).width > R * 0.72) label = label.slice(0, -1);
      if (label !== s.name) label = label.slice(0, -1) + '…';
      g.lineWidth = Math.max(3, size / 4); g.strokeStyle = 'rgba(5,10,12,.75)'; g.strokeText(label, R - 14, 0);
      g.fillStyle = '#fff'; g.fillText(label, R - 14, 0);
      g.restore();
    }
  }
  g.restore();
  // rim + hub
  g.beginPath(); g.arc(cx, cy, R, 0, Math.PI * 2); g.strokeStyle = '#0b1214'; g.lineWidth = 8; g.stroke();
  g.strokeStyle = 'rgba(47,216,200,.9)'; g.lineWidth = 3; g.stroke();
  g.beginPath(); g.arc(cx, cy, R * 0.1, 0, Math.PI * 2); g.fillStyle = '#0b1214'; g.fill(); g.strokeStyle = '#2fd8c8'; g.lineWidth = 3; g.stroke();
  // pointer
  g.beginPath(); g.moveTo(cx, cy - R + 26); g.lineTo(cx - 18, cy - R - 12); g.lineTo(cx + 18, cy - R - 12); g.closePath();
  g.fillStyle = '#ffd34d'; g.fill(); g.strokeStyle = '#0b1214'; g.lineWidth = 3; g.stroke();
  // result
  if (cur.phase === 'hold' || cur.phase === 'out' || cur.phase === 'next') {
    const k = Math.min(1, (now - cur.t0) / 250);
    const y = cy + R + 60;
    const w = Math.min(W * 0.9, R * 2.2), h = Math.max(56, R * 0.3);
    g.save(); g.globalAlpha = alpha * k;
    g.fillStyle = 'rgba(7,12,14,.88)'; g.strokeStyle = row.color || '#2fd8c8'; g.lineWidth = 3;
    g.beginPath(); g.roundRect(cx - w / 2, y - h / 2, w, h, 16); g.fill(); g.stroke();
    text(row.result, cx, y, fit(row.result, w - 40, h * 0.5), '#ffffff', 900);
    g.restore();
  }
  g.globalAlpha = 1;
}
requestAnimationFrame(tick);

// ---------- link to Allmind ----------
if (!DEMO) {
  const es = new EventSource('/api/roulette/events');
  let ver = null;
  es.addEventListener('hello', (e) => { const v = JSON.parse(e.data).pack; if (ver && v !== ver) location.reload(); ver = v; });
  es.addEventListener('reload', () => location.reload());
  es.addEventListener('config', (e) => { try { cfg = JSON.parse(e.data); } catch {} });
  es.addEventListener('queue', (e) => {
    try {
      queue = JSON.parse(e.data) || [];
      // forget ids the server no longer lists (confirmed shown, or skipped)
      for (const id of [...done]) if (!queue.some((r) => r.id === id)) done.delete(id);
      // skipped from the Xylem page while spinning → stop showing it
      if (cur && !queue.some((r) => r.id === cur.row.id) && cur.phase !== 'out' && cur.phase !== 'next') { cur.phase = 'out'; cur.t0 = performance.now(); }
    } catch {}
  });
} else {
  cfg = { title: '치즈 룰렛 (미리보기)', spinSec: 5, holdSec: 3, items: [
    { id: 'a', name: '꽝', weight: 40, color: '#ff6b6b' }, { id: 'b', name: '애교 한 번', weight: 25, color: '#ffd34d' },
    { id: 'c', name: '노래 한 소절', weight: 20, color: '#5be37d' }, { id: 'd', name: '벌칙 게임', weight: 10, color: '#4fc3f7' }, { id: 'e', name: '소원 들어주기', weight: 5, color: '#b388ff' }] };
  let n = 0;
  const add = () => { const it = cfg.items[Math.floor(Math.random() * cfg.items.length)]; queue.push({ id: 'demo' + (++n), nick: '미리보기', idx: 1, of: 1, itemId: it.id, result: it.name, color: it.color }); };
  window.ack = (id) => { done.add(id); queue = queue.filter((r) => r.id !== id); };
  add(); setInterval(() => { if (!queue.length) add(); }, 2000);
}
</script>
</body>
</html>

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>공중전 · Xylem</title>
<!--
  공중전 (dogfight) — OBS browser source overlay, 1920×1080, transparent.
  Chat: !출격 join · !미사일 fire a missile · !플레어 flares · !회피 cobra (missiles overshoot)
        !특수 special weapon (random: QAAM, 4AAM, HPAA, ADMM, EML, TLS) · !귀환 leave
        !시작 (streamer/manager) start now. Donations do nothing here — no pay-to-win.
  Boss round: !보스 (streamer/manager) makes the next round everyone vs. the aerial fortress BASTION;
  ?boss=N makes every N-th round a boss round. Its HP and firepower grow with the number of jets.
  Autopilot style (how your jet flies between your commands): !공격형 · !회피형 · !호위형 · !기본형
  Team mode (set on the Xylem page: 2–4 teams, owner's names): !팀 1 / !팀 <이름> joins or switches;
  !출격 joins the smallest team. Last team flying wins; bots even the teams out.
  Weather: clouds (a missile loses a jet inside one) and the sun (a missile chasing a jet into the
  sun can lose it in the glare). New each round. ?weather=0 turns it off.
  URL options: ?lobby=25 (seconds before a round) · ?fighters=4 (bots fill up to this)
               ?board=0 (hide ranking) · ?help=0 (hide the command list) · ?weather=0 · ?demo=1 (fake viewers,
               &team=3 for a demo team mode)
-->
<style>
  html, body { margin: 0; background: transparent; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; object-fit: contain; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
'use strict';
const W = 1920, H = 1080;
const cv = document.getElementById('c');
const g = cv.getContext('2d');
const Q = new URLSearchParams(location.search);
const LOBBY_S = Math.max(5, Number(Q.get('lobby')) || 25);
const FIGHTERS = Math.max(2, Math.min(12, Number(Q.get('fighters')) || 4));
const SHOW_BOARD = Q.get('board') !== '0';
const DEMO = Q.get('demo') === '1';
const SHOW_HELP = Q.get('help') !== '0';
const BOSS_EVERY = Math.max(0, Number(Q.get('boss')) || 0);
const WEATHER = Q.get('weather') !== '0';
const TEAM_LIMIT = 100;      // seconds for a team round; then the team with more jets (then HP) left wins
// Autopilot styles. Viewers pick with chat; bots get one at random. Only humans show the tag.
const STYLES = {
  normal: { name: '기본형', tag: '' },
  attack: { name: '공격형', tag: '⚔' },
  evade: { name: '회피형', tag: '☁' },
  escort: { name: '호위형', tag: '✚' },
};
const STYLE_CMDS = { '!공격형': 'attack', '!회피형': 'evade', '!방어형': 'evade', '!호위형': 'escort', '!기본형': 'normal' };
const STYLE_KEYS = Object.keys(STYLES);
const BOSS_LIMIT = 150;  // seconds for a boss round
const BOSS_NAME = '공중요새 BASTION';
const SP_CD = 25;      // special weapon reload (s)
const COBRA_CD = 12;   // evade reload (s)
const COBRA_S = 1.1;   // how long the cobra lasts
const EVADE_S = 3.5;   // after !회피, missiles that come close still overshoot (chat runs seconds behind the stream)
const ROUND_LIMIT = 80;      // seconds; then the healthiest jet wins
const RESULT_S = 8;
const FONT = '"Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif';
const ACCENT = '#2fd8c8';

// ---------- helpers ----------
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const wrapA = (a) => { while (a > Math.PI) a -= 2 * Math.PI; while (a < -Math.PI) a += 2 * Math.PI; return a; };
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const k = Math.floor(Math.random() * (i + 1)); [a[i], a[k]] = [a[k], a[i]]; } return a; } // fair, unlike sort(() => rnd)
function hueOf(s) { let h = 0; for (const ch of s) h = (h * 31 + ch.charCodeAt(0)) >>> 0; return h % 360; }
const BOT_NAMES = ['BOGEY', 'BANDIT', 'SKULL', 'VIPER', 'RAVEN', 'COBRA', 'JESTER', 'HOUND', 'WRAITH', 'GHOST', 'ONYX'];

// ---------- state ----------
const roster = new Map();   // uid → {uid, nick, human:true, role}
let jets = [];              // fighters this round (or lobby flyers)
let bullets = [], missiles = [], flares = [], parts = [], floats = [], feed = [], beams = [];
let board = [];
let phase = 'lobby';        // lobby | fight | result
let phaseT = 0;             // seconds into phase
let lobbyLeft = LOBBY_S;
let roundT = 0;
let winner = null;
let botSeq = 0;
let boss = null;            // the fortress during a boss round
let bossNext = false;       // !보스 queued the next round
let roundNo = 0;
let bossWon = false;        // result of the last boss round
let mode = { mode: 'solo', teams: [{ name: '레드', color: '#ff5a5a' }, { name: '블루', color: '#4f9dff' }] }; // from Allmind
let teamRound = false;      // this fight is a team fight
let teamWin = null;         // { idx, name, color, tie } after a team fight
let teamStats = [];         // per team at the end: { name, color, alive, jets, kills }
let clouds = [], sun = null;

function makeJet(p, i, n, fight) {
  // In a team fight every jet gets the same autopilot (bots' one), so a team with idle viewers isn't
  // weaker than an all-bot team — the result has to be fair when it's used to decide something.
  const h = p.human && !teamRound;
  const ang = (i / Math.max(1, n)) * Math.PI * 2;
  const j = {
    uid: p.uid, nick: p.nick, human: !!p.human,
    hue: p.human ? hueOf(p.uid) : 0,
    x: W / 2 + Math.cos(ang) * (fight ? 420 : rnd(150, 420)),
    y: H / 2 + Math.sin(ang) * (fight ? 330 : rnd(100, 300)),
    a: ang + Math.PI / 2 + (fight ? 0.3 : 0), spd: 300,
    hp: 100, alive: true, kills: 0,
    gunCd: rnd(0.5, 1.5), msslCd: h ? rnd(6, 10) : rnd(5, 9), manualMsslCd: 0,
    flareCd: 0, autoMsslAt: h ? rnd(14, 20) : rnd(8, 13),
    spCd: h ? 0 : rnd(18, 30), cobraCd: 0, cobra: 0, evade: 0, laser: 0, laserTarget: null,
    target: null, retarget: 0, jink: 0, jinkDir: 1, wp: null, trail: [], trailT: 0, flash: 0,
    style: p.style || (p.human ? 'normal' : STYLE_KEYS[Math.floor(Math.random() * STYLE_KEYS.length)]),
    team: p.team ?? null, lastHitBy: null, lastHitAt: -99,
  };
  return j;
}
function jetOf(uid) { return jets.find((j) => j.uid === uid); }

// ---------- lobby ----------
function rebuildLobbyJets() {
  const keep = new Map(jets.filter((j) => j.human).map((j) => [j.uid, j]));
  const list = [...roster.values()];
  jets = list.map((p, i) => {
    const old = keep.get(p.uid);
    if (old) { old.alive = true; old.hp = 100; old.nick = p.nick; old.style = p.style || 'normal'; old.team = p.team ?? null; return old; }
    const j = makeJet(p, i, list.length, false);
    j.x = rnd(-60, 0) < -30 ? -40 : W + 40; j.y = rnd(200, H - 200); j.a = j.x < 0 ? 0 : Math.PI;
    return j;
  });
}
const teamsOn = () => mode.mode === 'team';
function smallestTeam(skip) {
  const c = mode.teams.map(() => 0);
  for (const r of roster.values()) if (r !== skip && r.team != null && r.team < c.length) c[r.team]++;
  const min = Math.min(...c);
  const pick = c.map((v, i) => (v === min ? i : -1)).filter((i) => i >= 0);
  return pick[Math.floor(Math.random() * pick.length)];
}
// "!팀 2" / "!팀 블루" / "!팀블루"
function teamArg(text) {
  const arg = text.replace(/^!팀\s*/, '').trim().toLowerCase();
  if (!arg) return null;
  const n = Number(arg);
  if (Number.isInteger(n) && n >= 1 && n <= mode.teams.length) return n - 1;
  const i = mode.teams.findIndex((t) => t.name.toLowerCase() === arg);
  if (i >= 0) return i;
  const j = mode.teams.findIndex((t) => t.name.toLowerCase().startsWith(arg));
  return j >= 0 ? j : null;
}
function chooseTeam(p, idx) {
  if (!teamsOn()) return;
  let r = roster.get(p.uid);
  if (!r) { join(p, idx); return; }
  if (idx == null || idx === r.team) return;
  r.team = idx;
  if (phase === 'lobby') { rebuildLobbyJets(); say(`${r.nick} → ${mode.teams[idx].name}`, mode.teams[idx].color); }
  else say(`${r.nick} 다음 라운드부터 ${mode.teams[idx].name}`, '#9fb8b6');
}
function setStyle(p, style) {
  const r = roster.get(p.uid);
  if (!r) { join(p); return setStyle(p, style); }
  r.style = style;
  const j = jetOf(p.uid);
  if (j) { j.style = style; floatText(j, STYLES[style].name, '#c9f7ff'); }
}
function setMode(m) {
  if (!m || !Array.isArray(m.teams) || m.teams.length < 2) return;
  const was = mode.mode;
  mode = { mode: m.mode === 'team' ? 'team' : 'solo', teams: m.teams.slice(0, 4) };
  for (const r of roster.values()) if (r.team != null && r.team >= mode.teams.length) r.team = null;
  if (teamsOn()) for (const r of roster.values()) if (r.team == null) r.team = smallestTeam(r);
  if (phase === 'lobby') rebuildLobbyJets();
  if (was !== mode.mode) say(teamsOn() ? `다음 라운드부터 팀전 — ${mode.teams.map((t) => t.name).join(' vs ')}` : '다음 라운드부터 개인전', '#ffd34d', true);
}

function join(p, team) {
  if (roster.has(p.uid)) { const r = roster.get(p.uid); r.nick = p.nick; return; }
  if (roster.size >= 24) return;
  roster.set(p.uid, { uid: p.uid, nick: p.nick || '???', human: true, role: p.role, style: 'normal', team: null });
  if (teamsOn()) roster.get(p.uid).team = team ?? smallestTeam(roster.get(p.uid));
  if (phase === 'lobby') {
    rebuildLobbyJets();
    if (lobbyLeft < 3) lobbyLeft = 3; // a last-second joiner gets a moment, but nobody can stall the lobby
    const tm = teamsOn() ? mode.teams[roster.get(p.uid).team] : null;
    say(tm ? `${p.nick} 출격 준비 완료 — ${tm.name}` : `${p.nick} 출격 준비 완료`, tm ? tm.color : ACCENT);
  } else {
    say(`${p.nick} 다음 라운드 대기`, '#9fb8b6');
  }
}
function leave(uid) {
  const r = roster.get(uid); if (!r) return;
  roster.delete(uid);
  if (phase === 'lobby') { jets = jets.filter((j) => j.uid !== uid); }
  say(`${r.nick} 귀환`, '#9fb8b6');
}

function startFight() {
  roundNo++;
  makeWeather();
  teamRound = false; teamWin = null;
  if (bossNext || (BOSS_EVERY && roundNo % BOSS_EVERY === 0)) { bossNext = false; return startBoss(); }
  boss = null;
  if (teamsOn()) return startTeams();
  const humans = [...roster.values()];
  const list = humans.slice();
  const nBots = Math.max(0, FIGHTERS - humans.length);
  const names = BOT_NAMES.slice(); shuffle(names);
  for (let i = 0; i < nBots; i++) list.push({ uid: `bot:${++botSeq}`, nick: names[i % names.length], human: false });
  shuffle(list);
  jets = list.map((p, i) => makeJet(p, i, list.length, true));
  bullets = []; missiles = []; flares = []; beams = [];
  phase = 'fight'; phaseT = 0; roundT = 0; winner = null;
  say('교전 개시 — ENGAGE!', '#ffd34d', true);
}

// ---------- team fight ----------
function startTeams() {
  teamRound = true;
  const n = mode.teams.length;
  const humans = [...roster.values()];
  for (const h of humans) if (h.team == null || h.team >= n) h.team = smallestTeam(h);
  const counts = mode.teams.map((_, i) => humans.filter((h) => h.team === i).length);
  // every team gets the same number of jets: bots fill up (at least 2 a side, about FIGHTERS in total)
  const per = Math.min(8, Math.max(2, ...counts, Math.ceil(FIGHTERS / n)));
  const names = BOT_NAMES.slice(); shuffle(names);
  let k = 0;
  const groups = mode.teams.map((_, i) => {
    const list = humans.filter((h) => h.team === i).slice(0, per);
    while (list.length < per) list.push({ uid: `bot:${++botSeq}`, nick: names[k++ % names.length], human: false, team: i });
    return list;
  });
  jets = [];
  // start points every team is equally far from: opposite sides / a triangle / the four corners,
  // shuffled each round so no team always gets the same one
  const SPOTS = { 2: [[-680, 0], [680, 0]], 3: [[0, -360], [312, 180], [-312, 180]].map(([x, y]) => [x, y + 30]), 4: [[-600, -300], [600, -300], [600, 300], [-600, 300]] }[n];
  const slots = shuffle(SPOTS.slice());
  groups.forEach((list, ti) => {
    const cx = W / 2 + slots[ti][0], cy = H / 2 + slots[ti][1];
    list.forEach((p, i) => {
      const j = makeJet({ ...p, team: ti }, i, list.length, true);
      const row = i - (list.length - 1) / 2;
      const head = Math.atan2(H / 2 - cy, W / 2 - cx);
      j.x = cx + Math.cos(head + Math.PI / 2) * row * 70 - Math.cos(head) * Math.abs(row) * 30;
      j.y = cy + Math.sin(head + Math.PI / 2) * row * 70 - Math.sin(head) * Math.abs(row) * 30;
      j.a = head;
      jets.push(j);
    });
  });
  shuffle(jets); // update order must not favour a team
  bullets = []; missiles = []; flares = []; beams = [];
  phase = 'fight'; phaseT = 0; roundT = 0; winner = null;
  say(`팀전 개시 — ${mode.teams.map((t) => t.name).join(' vs ')}!`, '#ffd34d', true);
}
function teamAlive() { return mode.teams.map((_, i) => jets.filter((j) => j.team === i && j.alive).length); }
function endTeams() {
  teamStats = mode.teams.map((t, i) => {
    const mine = jets.filter((j) => j.team === i);
    return { idx: i, name: t.name, color: t.color, alive: mine.filter((j) => j.alive).length, jets: mine.length, humans: mine.filter((j) => j.human).length, hp: mine.reduce((a, j) => a + (j.alive ? j.hp : 0), 0), kills: mine.reduce((a, j) => a + j.kills, 0) };
  });
  const order = teamStats.slice().sort((a, b) => b.alive - a.alive || b.hp - a.hp || b.kills - a.kills);
  let top = order[0];
  const tied = order.filter((t) => t.alive === top.alive && t.hp === top.hp && t.kills === top.kills);
  const tie = tied.length > 1;
  if (tie) top = tied[Math.floor(Math.random() * tied.length)]; // a dead heat: drawn by lot (and said so)
  teamWin = { idx: top.idx, name: top.name, color: top.color, tie };
  phase = 'result'; phaseT = 0;
  say(`${top.name} 승리!${tie ? ' (동점 — 추첨)' : ''}`, top.color, true);
  const humans = jets.filter((j) => j.human);
  fetch('/api/dogfight/result', {
    method: 'POST', headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ winner: null, pilots: humans.map((j) => ({ uid: j.uid, nick: j.nick, kills: j.kills })), team: { winner: top.name, color: top.color, teams: teamStats.map(({ name, alive, jets: n, humans: h }) => ({ name, alive, jets: n, humans: h })) } }),
  }).then((r) => r.json()).then((r) => { if (r.board) board = r.board; }).catch(() => {});
}

function endFight() {
  if (boss) return endBoss();
  if (teamRound) return endTeams();
  const alive = jets.filter((j) => j.alive);
  const pool = alive.length ? alive : jets;
  winner = pool.slice().sort((a, b) => b.hp - a.hp || b.kills - a.kills)[0] || null;
  phase = 'result'; phaseT = 0;
  const humans = jets.filter((j) => j.human);
  if (humans.length) {
    fetch('/api/dogfight/result', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ winner: winner && winner.human ? winner.uid : null, pilots: humans.map((j) => ({ uid: j.uid, nick: j.nick, kills: j.kills })) }),
    }).then((r) => r.json()).then((r) => { if (r.board) board = r.board; }).catch(() => {});
  }
}

function backToLobby() {
  boss = null; teamRound = false; teamWin = null; clouds = []; sun = null;
  phase = 'lobby'; phaseT = 0; lobbyLeft = LOBBY_S;
  bullets = []; missiles = []; flares = []; beams = [];
  jets = jets.filter((j) => j.human && roster.has(j.uid));
  rebuildLobbyJets();
}

// ---------- commands ----------
function onCmd(c) {
  const t = (c.text || '').trim().split(/\s+/)[0].toLowerCase();
  const p = { uid: c.uid || `nick:${c.nick}`, nick: c.nick || '???', role: c.role };
  if (['!출격', '!참전', '!sortie', '!join'].includes(t)) return join(p);
  if (t === '!팀' || t.startsWith('!팀') && !t.startsWith('!팀전')) {
    if (!teamsOn()) return;
    return chooseTeam(p, teamArg((c.text || '').trim()));
  }
  if (STYLE_CMDS[t]) return setStyle(p, STYLE_CMDS[t]);
  if (['!귀환', '!leave'].includes(t)) return leave(p.uid);
  const boss_ = c.role === 'streamer' || c.role === 'manager';
  if (['!시작', '!start'].includes(t) && boss_) {
    if (phase === 'lobby' && roster.size) lobbyLeft = 0;
    return;
  }
  if (['!보스', '!보스전', '!boss'].includes(t) && boss_) {
    if (!bossNext) { bossNext = true; say(`⚠ 다음 라운드는 보스전 — ${BOSS_NAME}`, '#ff6b6b', true); }
    return;
  }
  const MSSL = ['!미사일', '!fox2', '!missile', '!발사'];
  const FLARE = ['!플레어', '!flare'];
  const EVADE = ['!회피', '!코브라', '!evade', '!cobra'];
  const SPECIAL = ['!특수', '!특수무기', '!특수병기', '!sp', '!special'];
  if (phase !== 'fight') {
    // firing before the round counts as joining: less to explain
    if ([...MSSL, ...FLARE, ...EVADE, ...SPECIAL].includes(t)) join(p);
    return;
  }
  const j = jetOf(p.uid);
  if (!j || !j.alive) return;
  if (MSSL.includes(t)) {
    if (j.manualMsslCd <= 0) { if (fireMissile(j)) j.manualMsslCd = 7; }
    else floatText(j, `재장전 ${Math.ceil(j.manualMsslCd)}`, '#9fb8b6');
  } else if (FLARE.includes(t)) {
    if (j.flareCd <= 0) dropFlares(j, true); else floatText(j, `플레어 ${Math.ceil(j.flareCd)}`, '#9fb8b6');
  } else if (EVADE.includes(t)) {
    if (j.cobraCd <= 0) cobra(j); else floatText(j, `회피 ${Math.ceil(j.cobraCd)}`, '#9fb8b6');
  } else if (SPECIAL.includes(t)) {
    if (j.spCd <= 0) { if (fireSpecial(j)) j.spCd = SP_CD; }
    else floatText(j, `특수무기 ${Math.ceil(j.spCd)}`, '#9fb8b6');
  }
}

// ---------- weapons ----------
// o: spd (launch), max, acc, turn (rad/s), dmg, life, flareRes (0..1, chance to ignore flares/cobra),
//    color, size, label (shown in the kill feed)
function launch(j, t, o = {}) {
  const a = j.a + (o.spread || 0);
  missiles.push({
    x: j.x + Math.cos(a) * 20, y: j.y + Math.sin(a) * 20, a, owner: j, target: t, trail: [], decoyed: false, lost: false,
    spd: o.spd || 480, max: o.max || 780, acc: o.acc || 420, turn: o.turn || 2.3, dmg: o.dmg || 45, life: o.life || 3.6,
    flareRes: o.flareRes || 0, color: o.color || '#f2f2f2', size: o.size || 1, label: o.label || '미사일', smoke: o.smoke || 'rgba(220,220,220,',
  });
}
function fireMissile(j) {
  let t = j.target && j.target.alive ? j.target : nearestEnemy(j);
  if (!t) return false;
  if (!t.isBoss && inCloud(t)) { // no lock on a jet inside a cloud: take another one, if there is one
    t = enemiesBy(j).find((o) => !inCloud(o));
    if (!t) { floatText(j, 'LOCK 불가 (구름)', '#9fb8b6'); return false; }
  }
  launch(j, t);
  floatText(j, 'FOX 2!', '#ffd34d');
  return true;
}
const foe = (a, b) => a !== b && b.alive && !(teamRound && a.team === b.team);
function enemiesBy(j, maxD = 1e9) {
  if (boss) return boss.alive ? [boss] : [];
  return jets.filter((o) => foe(j, o) && dist(j, o) < maxD).sort((a, b) => dist(j, a) - dist(j, b));
}

// Special weapons — one at random per !특수 (Ace Combat-style arsenal)
const SPECIALS = [
  { id: 'QAAM', name: 'QAAM · 고기동 미사일', color: '#7fe3ff', fire(j, t) { launch(j, t, { turn: 5.2, life: 5, dmg: 50, flareRes: 0.6, color: '#7fe3ff', label: 'QAAM', smoke: 'rgba(127,227,255,' }); } },
  { id: '4AAM', name: '4AAM · 4목표 동시 공격', color: '#ffd34d', fire(j) { const ts = boss ? [boss, boss, boss, boss].slice(0, boss.alive ? 4 : 0) : enemiesBy(j).slice(0, 4); ts.forEach((t, i) => launch(j, t, { spread: (i - 1.5) * 0.25, dmg: 40, color: '#ffd34d', label: '4AAM' })); } },
  { id: 'HPAA', name: 'HPAA · 고위력 미사일', color: '#ff7a59', fire(j, t) { launch(j, t, { spd: 900, max: 1300, acc: 600, turn: 2.0, dmg: 75, flareRes: 0.35, size: 1.5, color: '#ff7a59', label: 'HPAA', smoke: 'rgba(255,160,120,' }); } },

// ---------- weather: clouds + sun ----------
// Clouds drift slowly; a missile can't lock a jet inside one and loses one that flies in.
// The sun sits just off one edge; a missile chasing a jet straight into it can lose it in the glare.
function makeWeather() {
  clouds = []; sun = null;
  if (!WEATHER) return;
  const n = 3 + Math.floor(Math.random() * 3);
  for (let i = 0; i < n; i++) {
    const r = rnd(80, 130);
    const puffs = [];
    const k = 5 + Math.floor(Math.random() * 3);
    for (let q = 0; q < k; q++) puffs.push({ x: rnd(-r, r) * 1.2, y: rnd(-r, r) * 0.5, r: rnd(r * 0.55, r * 0.9) });
    clouds.push({ x: rnd(260, W - 260), y: rnd(200, H - 220), vx: rnd(8, 18) * (Math.random() < 0.5 ? -1 : 1), puffs });
  }
  const spots = [[rnd(300, W - 300), -40], [-40, rnd(120, 420)], [W + 40, rnd(120, 420)], [rnd(200, 700), -40], [rnd(W - 700, W - 200), -40]];
  const [x, y] = spots[Math.floor(Math.random() * spots.length)];

}
function inCloud(o) {

  return false;
}
function nearestCloud(o) {

// called per missile each frame while it still tracks a jet
function weatherOnMissile(m, dt) {
  const t = m.target;

  if (inCloud(t)) {
    if (Math.random() < dt * 1.6 * (1 - m.flareRes * 0.5)) { m.lost = true; floatText(t, '구름 속으로!', '#dfe9ec'); }
    return;
  }
  if (sun) {
    const toSun = Math.atan2(sun.y - m.y, sun.x - m.x);
    const toT = Math.atan2(t.y - m.y, t.x - m.x);
    if (Math.abs(wrapA(toSun - toT)) < 0.3 && Math.abs(wrapA(toSun - m.a)) < 0.35 && Math.random() < dt * 1.2 * (1 - m.flareRes * 0.5)) {
      m.lost = true; floatText(t, '태양에 묻힘!', '#ffe9a0');
    }
  }
}
function updateWeather(dt) {
  for (const c of clouds) { c.x += c.vx * dt; if (c.x > W + 260) c.x = -260; if (c.x < -260) c.x = W + 260; }
}
function drawWeather() {
  if (sun) {
    const gr = g.createRadialGradient(sun.x, sun.y, 0, sun.x, sun.y, 300);
    gr.addColorStop(0, 'rgba(255,250,225,.55)'); gr.addColorStop(0.25, 'rgba(255,235,170,.22)'); gr.addColorStop(1, 'rgba(255,220,140,0)');
    g.fillStyle = gr; g.beginPath(); g.arc(sun.x, sun.y, 300, 0, Math.PI * 2); g.fill();

      const x = sun.x + (W / 2 - sun.x) * k, y = sun.y + (H / 2 - sun.y) * k;
      g.fillStyle = `rgba(255,240,200,${a})`; g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();
    }
  }

    const x = c.x + p.x, y = c.y + p.y;

    gr.addColorStop(0, 'rgba(236,243,246,.62)'); gr.addColorStop(0.7, 'rgba(220,232,238,.4)'); gr.addColorStop(1, 'rgba(210,225,232,0)');
    g.fillStyle = gr; g.beginPath(); g.arc(x, y, p.r, 0, Math.PI * 2); g.fill();

// ---------- effects ----------
function explode(x, y, big) {
  const n = big ? 46 : 10;
  for (let i = 0; i < n; i++) {
    const a = rnd(0, Math.PI * 2), s = rnd(40, big ? 380 : 160);
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rnd(0.4, big ? 1.4 : 0.5), max: 1.4, kind: Math.random() < 0.35 ? 'smoke' : 'fire', r: rnd(2, big ? 7 : 3) });
  }
  if (big) parts.push({ x, y, vx: 0, vy: 0, life: 0.5, max: 0.5, kind: 'ring', r: 10 });
}
function floatText(j, text, color) { floats.push({ x: j.x, y: j.y - 34, text, color, life: 1.3 }); }
function say(text, color, big) { feed.push({ text, color: color || '#e8f6f4', life: big ? 5 : 7 }); if (feed.length > 6) feed.shift(); }
function kill(victim, killer, how) {
  victim.alive = false; victim.hp = 0;
  explode(victim.x, victim.y, true);
  if (killer && killer !== victim) { killer.kills++; say(`${killer.nick} ▸ ${victim.nick} 격추 (${how})`, killer.human ? `hsl(${killer.hue} 85% 68%)` : '#ff8a8a'); floatText(killer, 'SPLASH!', '#ffd34d'); }
}
function damage(v, amount, from, how) {
  if (!v.alive) return;
  if (v.isBoss) return hitBoss(amount, from);
  if (boss && v.evade > 0 && how === '하전입자포') amount *= 0.15; // a cobra mostly dodges the beam
  v.hp -= amount; v.flash = 0.12;
  if (from && from !== v && !from.isBoss) { v.lastHitBy = from; v.lastHitAt = roundT; }

// ---------- AI / flight ----------
function steer(j, want, dt, rate) {
  const d = wrapA(want - j.a);
  const turn = clamp(d, -rate * dt, rate * dt);
  j.a = wrapA(j.a + turn);
  return Math.abs(d);
}
function edgeAvoid(j, want) {
  const M = 170;
  let ax = 0, ay = 0;
  if (j.x < M) ax = 1; else if (j.x > W - M) ax = -1;
  if (j.y < M) ay = 1; else if (j.y > H - M) ay = -1;
  if (!ax && !ay) return want;
  const toC = Math.atan2(H / 2 - j.y, W / 2 - j.x);
  const k = clamp(Math.max(ax ? (j.x < M ? (M - j.x) : (j.x - (W - M))) : 0, ay ? (j.y < M ? (M - j.y) : (j.y - (H - M))) : 0) / M, 0, 1);
  return want + wrapA(toC - want) * k;
}

function flyLobby(j, dt) {
  if (!j.wp || dist(j, j.wp) < 90) j.wp = { x: rnd(260, W - 260), y: rnd(200, H - 260) };
  steer(j, edgeAvoid(j, Math.atan2(j.wp.y - j.y, j.wp.x - j.x)), dt, 1.3);
  j.spd += (230 - j.spd) * dt;
}

function flyFight(j, dt) {

  j.spCd -= dt; j.cobraCd -= dt; j.evade -= dt;

  const t = j.target;
  const st = j.style;
  if (j.cobra > 0) { // nose high, nearly stalled, swinging onto the nearest enemy
    j.cobra -= dt;
    const n = nearestEnemy(j);
    if (n) steer(j, Math.atan2(n.y - j.y, n.x - j.x), dt, 4.2);
    j.spd += (60 - j.spd) * Math.min(1, dt * 7);

  }
  if (j.laser > 0) { // TLS: keep the beam on the target
    j.laser -= dt;

    else for (const o of jets) if (foe(j, o) && segDist(o.x, o.y, j.x, j.y, x2, y2) < 16) damage(o, 75 * dt, j, 'TLS');
    j.spd += (220 - j.spd) * dt * 2;

    if (close && j.cobraCd <= 0 && Math.random() < dt * 1.5) cobra(j);

// who to chase: 호위형 guards a teammate (whoever is after them), or hits back at its last attacker
function pickTarget(j) {
  if (boss) return nearestEnemy(j);
  if (j.style === 'escort') {
    const b = buddyOf(j);
    if (b) {
      const onBuddy = jets.filter((o) => foe(j, o) && o.target === b).sort((p, q) => dist(b, p) - dist(b, q))[0];
      return onBuddy || nearestEnemy(j, b);
    }
    if (j.lastHitBy && j.lastHitBy.alive && foe(j, j.lastHitBy) && roundT - j.lastHitAt < 10) return j.lastHitBy;
  }
  return nearestEnemy(j);
}
function buddyOf(j) {
  if (!teamRound) return null;

  const mates = jets.filter((o) => o !== j && o.alive && o.team === j.team).sort((p, q) => (q.human - p.human) || dist(j, p) - dist(j, q));
  j.buddy = mates[0] || null;
  return j.buddy;
}
function hideSpot(j, threat) {
  const c = nearestCloud(j);

  return null;
}

function moveJet(j, dt) {
  j.x += Math.cos(j.a) * j.spd * dt;
  j.y += Math.sin(j.a) * j.spd * dt;
  j.trailT -= dt; j.flash -= dt;
  if (j.trailT <= 0) { j.trailT = 0.03; j.trail.push({ x: j.x - Math.cos(j.a) * 14, y: j.y - Math.sin(j.a) * 14 }); if (j.trail.length > 22) j.trail.shift(); }
}

// ---------- update ----------
function update(dt) {
  phaseT += dt;
  if (phase === 'lobby') {
    if (roster.size) { lobbyLeft -= dt; if (lobbyLeft <= 0) startFight(); }
    else lobbyLeft = LOBBY_S;
    for (const j of jets) { flyLobby(j, dt); moveJet(j, dt); }
  } else if (phase === 'fight') {
    roundT += dt;
    updateWeather(dt);
    for (const j of jets) if (j.alive) { flyFight(j, dt); moveJet(j, dt); }
    if (boss) updateBoss(dt);
    for (const b of bullets) {
      b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
      if (boss && b.owner !== boss) { // allies don't hit each other in a boss round
        if (boss.alive && insideBoss(b.x, b.y)) { damage(boss, 6, b.owner, '기관포'); b.life = 0; parts.push({ x: b.x, y: b.y, vx: 0, vy: 0, life: 0.15, max: 0.15, kind: 'fire', r: 4 }); }
        continue;
      }
      for (const j of jets) if (j.alive && j !== b.owner && !(teamRound && b.owner.team === j.team) && Math.hypot(j.x - b.x, j.y - b.y) < 18) { damage(j, b.owner === boss ? 2 : 6, b.owner, b.owner === boss ? '대공포' : '기관포'); b.life = 0; parts.push({ x: b.x, y: b.y, vx: 0, vy: 0, life: 0.15, max: 0.15, kind: 'fire', r: 4 }); break; }
    }
    for (const m of missiles) {
      m.life -= dt; m.spd = Math.min(m.max, m.spd + m.acc * dt);
      let tx, ty;
      if (!m.lost && !m.decoyed && m.target.alive && m.target.evade > 0 && dist(m, m.target) < 220) breakLock(m);
      if (m.target.alive) weatherOnMissile(m, dt);
      if (m.lost) { tx = m.x + Math.cos(m.a) * 100; ty = m.y + Math.sin(m.a) * 100; } // overshot a cobra: flies on
      else if (m.decoyed) { const f = flares[flares.length - 1]; tx = f ? f.x : m.x + Math.cos(m.a) * 100; ty = f ? f.y : m.y + Math.sin(m.a) * 100; }
      else if (m.target.alive) { tx = m.target.x; ty = m.target.y; }
      else { tx = m.x + Math.cos(m.a) * 100; ty = m.y + Math.sin(m.a) * 100; }
      const d = wrapA(Math.atan2(ty - m.y, tx - m.x) - m.a);
      m.a = wrapA(m.a + clamp(d, -m.turn * dt, m.turn * dt));
      m.x += Math.cos(m.a) * m.spd * dt; m.y += Math.sin(m.a) * m.spd * dt;
      m.trail.push({ x: m.x, y: m.y }); if (m.trail.length > 26) m.trail.shift();
      const hit = m.target.isBoss ? insideBoss(m.x, m.y) : dist(m, m.target) < 26;
      if (!m.decoyed && !m.lost && m.target.alive && hit) { damage(m.target, m.dmg, m.owner, m.label); explode(m.x, m.y, false); m.life = 0; }
      else if (m.life <= 0) explode(m.x, m.y, false);
    }
    bullets = bullets.filter((b) => b.life > 0);
    missiles = missiles.filter((m) => m.life > 0 && m.x > -200 && m.x < W + 200 && m.y > -200 && m.y < H + 200);
    const alive = jets.filter((j) => j.alive).length;
    if (boss) { if ((!boss.alive && boss.dying <= 0) || alive === 0 || roundT > BOSS_LIMIT) endFight(); }
    else if (teamRound) { if (teamAlive().filter((n) => n > 0).length <= 1 || roundT > TEAM_LIMIT) endFight(); }
    else if (alive <= 1 || roundT > ROUND_LIMIT) endFight();
  } else if (phase === 'result') {
    updateWeather(dt);
    if (boss) { for (const j of jets) if (j.alive) { flyLobby(j, dt); moveJet(j, dt); } if (boss.alive) updateBoss(dt, true); }
    else if (teamRound) { for (const j of jets) if (j.alive) { flyLobby(j, dt); moveJet(j, dt); } }
    else if (winner && winner.alive) { flyLobby(winner, dt); moveJet(winner, dt); }
    if (phaseT > (teamRound ? RESULT_S + 4 : RESULT_S)) backToLobby();
  }
  for (const b of beams) b.life -= dt;
  beams = beams.filter((b) => b.life > 0);
  for (const f of flares) { f.x += f.vx * dt; f.y += f.vy * dt + 40 * dt; f.vx *= 0.97; f.vy *= 0.97; f.life -= dt; }
  flares = flares.filter((f) => f.life > 0);
  for (const p of parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.96; p.vy = p.vy * 0.96 + (p.kind === 'smoke' ? -20 : 60) * dt; p.life -= dt; if (p.kind === 'ring') p.r += 420 * dt; if (p.kind === 'vapor') p.r += 160 * dt; }
  parts = parts.filter((p) => p.life > 0);
  for (const f of floats) { f.y -= 26 * dt; f.life -= dt; }
  floats = floats.filter((f) => f.life > 0);
  for (const f of feed) f.life -= dt;
  feed = feed.filter((f) => f.life > 0);
}

// ---------- boss round: everyone vs. the aerial fortress ----------
// Outline in its own coordinates (nose at +x). Turrets sit on the wings; engines at the back.
const BOSS_SHAPE = [[150,0],[60,-50],[0,-150],[-30,-250],[-80,-255],[-70,-110],[-130,-70],[-115,0],[-130,70],[-70,110],[-80,255],[-30,250],[0,150],[60,50]];
const TURRETS = [[30,-70],[30,70],[-30,-170],[-30,170],[-85,-40],[-85,40]];
function pip(poly, x, y) { // point in polygon
  let inside = false;
  for (let i = 0, k = poly.length - 1; i < poly.length; k = i++) {
    const [xi, yi] = poly[i], [xk, yk] = poly[k];
    if ((yi > y) !== (yk > y) && x < ((xk - xi) * (y - yi)) / (yk - yi) + xi) inside = !inside;
  }
  return inside;
}
function toBoss(x, y) { const dx = x - boss.x, dy = y - boss.y, c = Math.cos(-boss.a), s_ = Math.sin(-boss.a); return [dx * c - dy * s_, dx * s_ + dy * c]; }
function fromBoss(lx, ly) { const c = Math.cos(boss.a), s_ = Math.sin(boss.a); return [boss.x + lx * c - ly * s_, boss.y + lx * s_ + ly * c]; }
function insideBoss(x, y) { const [lx, ly] = toBoss(x, y); return pip(BOSS_SHAPE, lx, ly); }

function startBoss() {
  const humans = [...roster.values()];
  const list = humans.slice();
  // a lone viewer still gets wingmen: at least 3 jets
  const names = BOT_NAMES.slice(); shuffle(names);
  for (let i = 0; list.length < 3; i++) list.push({ uid: `bot:${++botSeq}`, nick: names[i % names.length], human: false });
  jets = list.map((p, i) => { const j = makeJet(p, i, list.length, true); j.x = 260 + (i % 6) * 70; j.y = H - 200 - Math.floor(i / 6) * 70; j.a = -Math.PI / 3; j.bossDmg = 0; j.dodgeBeam = false; return j; });
  const n = jets.length;
  // difficulty grows with the number of jets: more HP, more turret fire, bigger salvos
  const hp = 800 + 900 * n + 15 * n * n; // big crowds deal more than the sum of their parts (specials, focus)
  boss = {
    isBoss: true, nick: BOSS_NAME, uid: 'boss', human: false, alive: true, kills: 0, x: W / 2 + 200, y: H / 2 - 60, a: Math.PI, spd: 40, t: 0,
    hp, max: hp, flash: 0, n, phase2: false, dying: 0,
    fire: Math.min(1.8, 0.2 + 0.1 * n), salvo: 1 + Math.floor(n / 4),
    salvoCd: 6, laserCd: 12, beam: null,
    turrets: TURRETS.map(([x, y]) => ({ x, y, alive: true, cd: rnd(1, 3), aim: Math.PI })),
  };
  bullets = []; missiles = []; flares = []; beams = [];
  phase = 'fight'; phaseT = 0; roundT = 0; winner = null; bossWon = false;
  say(`⚠ 보스전 — ${BOSS_NAME} 출현! 전원 공격!`, '#ff6b6b', true);
}

function hitBoss(amount, from) {
  if (!boss.alive) return;
  boss.hp -= amount; boss.flash = 0.06;
  if (from && from.bossDmg !== undefined) from.bossDmg += amount;
  // turrets fall off as the hull breaks up
  const share = boss.hp / boss.max;
  const alive = boss.turrets.filter((t) => t.alive);
  const shouldHave = Math.ceil(share * TURRETS.length);
  if (alive.length > shouldHave) { const t = alive[Math.floor(Math.random() * alive.length)]; t.alive = false; const [x, y] = fromBoss(t.x, t.y); explode(x, y, true); say('요새 대공포 파괴!', '#ffd34d'); }
  if (!boss.phase2 && share < 0.5) { boss.phase2 = true; say('⚠ 요새가 폭주한다 — 공격 패턴 강화!', '#ff6b6b', true); }
  if (boss.hp <= 0) {
    boss.alive = false; boss.dying = 2.6; boss.beam = null;
    if (from && from.kills !== undefined) { from.kills++; say(`${from.nick} ▸ ${BOSS_NAME} 격파!`, from.human ? `hsl(${from.hue} 85% 68%)` : '#ffd34d', true); }
  }
}

function updateBoss(dt, idle) {
  boss.t += dt; boss.flash -= dt;
  if (!boss.alive) { // breaking up
    boss.dying -= dt;
    if (Math.random() < dt * 14) { const [x, y] = fromBoss(rnd(-120, 140), rnd(-240, 240)); explode(x, y, Math.random() < 0.5); }
    boss.y += 30 * dt;
    return;
  }
  // slow drift across the middle of the screen
  const tx = W / 2 + Math.sin(boss.t * 0.11) * 300, ty = H / 2 - 40 + Math.sin(boss.t * 0.19) * 130;
  const want = Math.atan2(ty - boss.y, tx - boss.x);
  boss.a = wrapA(boss.a + clamp(wrapA(want - boss.a), -0.25 * dt, 0.25 * dt));
  boss.x += (tx - boss.x) * dt * 0.35; boss.y += (ty - boss.y) * dt * 0.35;
  if (idle) return;
  const targets = jets.filter((j) => j.alive);
  if (!targets.length) return;
  const rate = boss.fire * (boss.phase2 ? 1.35 : 1);
  // anti-air turrets: short bursts at the closest jet
  for (const tu of boss.turrets) {
    if (!tu.alive) continue;
    const [x, y] = fromBoss(tu.x, tu.y);
    let best = null, bd = 700;
    for (const j of targets) { const d = Math.hypot(j.x - x, j.y - y); if (d < bd) { bd = d; best = j; } }
    if (!best) continue;
    tu.aim = Math.atan2(best.y - y, best.x - x);
    tu.cd -= dt;
    if (tu.cd <= 0) {
      tu.cd = rnd(0.45, 0.8) / rate;
      const a = tu.aim + rnd(-0.12, 0.12);
      bullets.push({ x, y, vx: Math.cos(a) * 820, vy: Math.sin(a) * 820, life: 0.9, owner: boss });
    }
  }
  // missile salvo
  boss.salvoCd -= dt;
  if (boss.salvoCd <= 0) {
    boss.salvoCd = boss.phase2 ? 7 : 9.5;
    const n = boss.salvo + (boss.phase2 ? 1 : 0);
    for (let i = 0; i < n; i++) {
      const t = targets[Math.floor(Math.random() * targets.length)];
      launch(boss, t, { spread: wrapA(Math.atan2(t.y - boss.y, t.x - boss.x) - boss.a) + rnd(-0.8, 0.8), spd: 300, max: 620, turn: 2.0, dmg: 20, life: 4.5, color: '#ff6b6b', label: '요새 미사일', smoke: 'rgba(255,140,140,' });
    }
    say(`요새 미사일 ${n}발 발사!`, '#ff8a8a');
  }
  // charged particle beam: aimed at someone, warned for 1.6 s, then fires for 1.3 s
  boss.laserCd -= dt;
  if (!boss.beam && boss.laserCd <= 0) {
    const t = targets[Math.floor(Math.random() * targets.length)];
    boss.beam = { a: Math.atan2(t.y - boss.y, t.x - boss.x), warn: 1.6, fire: 1.3 };
    boss.laserCd = boss.phase2 ? 11 : 16;
    for (const j of jets) j.dodgeBeam = Math.random() < 0.6; // autopilots only sometimes notice
    say('⚠ 하전입자포 충전 중 — !회피', '#ff6b6b');
  }
  if (boss.beam) {
    const b = boss.beam;
    if (b.warn > 0) b.warn -= dt;
    else {
      b.fire -= dt;
      const x2 = boss.x + Math.cos(b.a) * 2400, y2 = boss.y + Math.sin(b.a) * 2400;
      for (const j of targets) if (segDist(j.x, j.y, boss.x, boss.y, x2, y2) < 34) damage(j, 60 * dt, boss, '하전입자포');
      if (b.fire <= 0) boss.beam = null;
    }
  }
}

function endBoss() {
  bossWon = !boss.alive;
  const humans = jets.filter((j) => j.human);
  const mvp = jets.slice().sort((a, b) => b.bossDmg - a.bossDmg)[0] || null;
  winner = mvp;
  phase = 'result'; phaseT = 0;
  if (humans.length) {
    fetch('/api/dogfight/result', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ winner: bossWon && mvp && mvp.human ? mvp.uid : null, pilots: humans.map((j) => ({ uid: j.uid, nick: j.nick, kills: j.kills })) }),
    }).then((r) => r.json()).then((r) => { if (r.board) board = r.board; }).catch(() => {});
  }
}

function drawBoss(now) {
  if (!boss || (!boss.alive && boss.dying <= 0)) return;
  // beam (under the hull)
  if (boss.beam) {
    const b = boss.beam, x2 = boss.x + Math.cos(b.a) * 2400, y2 = boss.y + Math.sin(b.a) * 2400;
    if (b.warn > 0) {
      g.setLineDash([18, 14]); g.strokeStyle = `rgba(255,70,70,${0.4 + 0.4 * Math.abs(Math.sin(now * 14))})`; g.lineWidth = 3;
      g.beginPath(); g.moveTo(boss.x, boss.y); g.lineTo(x2, y2); g.stroke(); g.setLineDash([]);
    } else {
      g.strokeStyle = `rgba(255,60,120,${0.55 + Math.random() * 0.25})`; g.lineWidth = 60; g.beginPath(); g.moveTo(boss.x, boss.y); g.lineTo(x2, y2); g.stroke();
      g.strokeStyle = 'rgba(255,235,245,.95)'; g.lineWidth = 16; g.stroke();
    }
  }
  g.save(); g.translate(boss.x, boss.y); g.rotate(boss.a);
  if (!boss.alive) g.globalAlpha = clamp(boss.dying / 2.6, 0, 1);
  // engines
  for (const ey of [-40, 0, 40]) { const fl = 26 + Math.sin(now * 30 + ey) * 8; g.fillStyle = 'rgba(255,150,60,.9)'; g.beginPath(); g.moveTo(-118, ey - 8); g.lineTo(-118 - fl, ey); g.lineTo(-118, ey + 8); g.fill(); }
  g.beginPath(); BOSS_SHAPE.forEach(([x, y], i) => (i ? g.lineTo(x, y) : g.moveTo(x, y))); g.closePath();
  g.fillStyle = boss.flash > 0 ? '#3e4b51' : '#2c363b'; g.fill();
  g.strokeStyle = 'rgba(3,10,12,.95)'; g.lineWidth = 4; g.stroke();
  // panel lines + spine
  g.strokeStyle = 'rgba(47,216,200,.35)'; g.lineWidth = 2;
  g.beginPath(); g.moveTo(140, 0); g.lineTo(-115, 0); g.moveTo(40, -45); g.lineTo(-60, -230); g.moveTo(40, 45); g.lineTo(-60, 230); g.stroke();
  // cockpit strip + blinking lights
  g.fillStyle = 'rgba(47,216,200,.8)'; g.fillRect(70, -6, 50, 12);
  const blink = Math.sin(now * 6) > 0;
  g.fillStyle = blink ? '#ff4d4d' : '#5a1a1a'; for (const [x, y] of [[-78, -250], [-78, 250]]) { g.beginPath(); g.arc(x, y, 6, 0, Math.PI * 2); g.fill(); }
  // turrets
  for (const tu of boss.turrets) {
    g.save(); g.translate(tu.x, tu.y);
    if (tu.alive) {
      g.fillStyle = '#4b585e'; g.beginPath(); g.arc(0, 0, 13, 0, Math.PI * 2); g.fill(); g.strokeStyle = '#0a1214'; g.lineWidth = 2; g.stroke();
      g.rotate(tu.aim - boss.a); g.fillStyle = '#9fb3b8'; g.fillRect(4, -3, 18, 6);
    } else { g.fillStyle = '#151a1c'; g.beginPath(); g.arc(0, 0, 11, 0, Math.PI * 2); g.fill(); }
    g.restore();
  }
  g.restore();
  g.globalAlpha = 1;
  // charging glow at the nose while the beam warns
  if (boss.beam && boss.beam.warn > 0) { const [nx, ny] = fromBoss(150, 0); g.fillStyle = `rgba(255,80,140,${0.5 + 0.4 * Math.sin(now * 20)})`; g.beginPath(); g.arc(nx, ny, 14 + (1.6 - boss.beam.warn) * 14, 0, Math.PI * 2); g.fill(); }
}

// ---------- drawing ----------
const SHAPE = [[22,0],[6,-4],[-3,-17],[-9,-17],[-6,-5],[-14,-8],[-17,-8],[-14,0],[-17,8],[-14,8],[-6,5],[-9,17],[-3,17],[6,4]];
function text(s, x, y, size, color, align = 'left', weight = 700) {
  g.font = `${weight} ${size}px ${FONT}`; g.textAlign = align; g.textBaseline = 'middle';
  g.lineJoin = 'round'; g.lineWidth = Math.max(3, size / 5); g.strokeStyle = 'rgba(3,10,12,.85)';
  g.strokeText(s, x, y); g.fillStyle = color; g.fillText(s, x, y);
}
function panel(x, y, w, h) {
  g.fillStyle = 'rgba(7,14,16,.72)'; g.strokeStyle = 'rgba(47,216,200,.45)'; g.lineWidth = 2;
  g.beginPath(); g.roundRect(x, y, w, h, 14); g.fill(); g.stroke();
}
const showTeams = () => (phase === 'lobby' ? teamsOn() : teamRound);
function jetColor(j, l = 62) {
  if (showTeams() && j.team != null && mode.teams[j.team]) return mode.teams[j.team].color;
  return j.human ? `hsl(${j.hue} 80% ${l}%)` : `hsl(0 10% ${l - 8}%)`;
}

function drawJet(j, now) {
  // trail
  if (j.trail.length > 1) {
    g.lineCap = 'round';
    for (let i = 1; i < j.trail.length; i++) {
      g.strokeStyle = `rgba(255,255,255,${(i / j.trail.length) * 0.35})`; g.lineWidth = (i / j.trail.length) * 3;
      g.beginPath(); g.moveTo(j.trail[i - 1].x, j.trail[i - 1].y); g.lineTo(j.trail[i].x, j.trail[i].y); g.stroke();
    }
  }
  g.save(); g.translate(j.x, j.y); g.rotate(j.a);
  // cobra: seen from above the nose pitches up, so the jet looks foreshortened
  if (j.cobra > 0) { const k = Math.sin(Math.PI * (1 - j.cobra / COBRA_S)); g.scale(1 - 0.6 * k, 1); }
  // afterburner
  const fl = 10 + Math.sin(now * 40 + j.x) * 4;
  g.fillStyle = 'rgba(255,170,60,.9)';
  g.beginPath(); g.moveTo(-14, -3); g.lineTo(-14 - fl, 0); g.lineTo(-14, 3); g.fill();
  g.beginPath();
  SHAPE.forEach(([x, y], i) => (i ? g.lineTo(x, y) : g.moveTo(x, y)));
  g.closePath();
  g.fillStyle = j.flash > 0 ? '#fff' : jetColor(j);
  g.strokeStyle = 'rgba(3,10,12,.9)'; g.lineWidth = 2.5;
  g.fill();
  if (!j.human && j.flash <= 0 && showTeams() && j.team != null) { g.fillStyle = 'rgba(0,0,0,.38)'; g.fill(); } // team bots: darker shade of the team colour
  g.stroke();
  g.fillStyle = 'rgba(10,30,40,.85)'; g.beginPath(); g.ellipse(7, 0, 5, 2.2, 0, 0, Math.PI * 2); g.fill();
  g.restore();
  // label + hp
  const tag = j.human && STYLES[j.style]?.tag ? ` ${STYLES[j.style].tag}` : '';
  text(j.nick + tag, j.x, j.y - 36, 22, j.human ? jetColor(j, 74) : showTeams() && j.team != null ? jetColor(j) : '#d9b3b3', 'center');
  if (phase === 'fight') {
    g.fillStyle = 'rgba(0,0,0,.6)'; g.fillRect(j.x - 24, j.y + 26, 48, 6);
    g.fillStyle = j.hp > 50 ? '#5be37d' : j.hp > 25 ? '#ffc93c' : '#ff5f5f'; g.fillRect(j.x - 24, j.y + 26, 48 * clamp(j.hp / 100, 0, 1), 6);
  }
}

function draw(now) {
  g.clearRect(0, 0, W, H);
  for (const f of flares) { g.fillStyle = `rgba(255,${150 + Math.random() * 80},60,${clamp(f.life, 0, 1)})`; g.beginPath(); g.arc(f.x, f.y, 4 + Math.random() * 2, 0, Math.PI * 2); g.fill(); }
  for (const m of missiles) {
    for (let i = 1; i < m.trail.length; i++) { g.strokeStyle = `${m.smoke}${(i / m.trail.length) * 0.5})`; g.lineWidth = 3 * m.size; g.beginPath(); g.moveTo(m.trail[i - 1].x, m.trail[i - 1].y); g.lineTo(m.trail[i].x, m.trail[i].y); g.stroke(); }
    g.save(); g.translate(m.x, m.y); g.rotate(m.a); g.scale(m.size, m.size); g.fillStyle = m.color; g.fillRect(-7, -2, 14, 4); g.fillStyle = '#ffb347'; g.fillRect(-11, -1.5, 4, 3); g.restore();
  }
  g.fillStyle = '#ffe9a0';
  for (const b of bullets) { g.save(); g.translate(b.x, b.y); g.rotate(Math.atan2(b.vy, b.vx)); g.fillRect(-6, -1.2, 12, 2.4); g.restore(); }
  for (const b of beams) { const k = b.life / b.max; g.strokeStyle = `rgba(${b.color},${k})`; g.lineWidth = b.w * (0.5 + k); g.beginPath(); g.moveTo(b.x1, b.y1); g.lineTo(b.x2, b.y2); g.stroke(); g.strokeStyle = `rgba(255,255,255,${k})`; g.lineWidth = 1.5; g.stroke(); }
  for (const j of jets) if (j.alive && j.laser > 0 && phase === 'fight') {
    const x2 = j.x + Math.cos(j.a) * 1000, y2 = j.y + Math.sin(j.a) * 1000;
    g.strokeStyle = `rgba(255,79,216,${0.45 + Math.random() * 0.3})`; g.lineWidth = 7; g.beginPath(); g.moveTo(j.x, j.y); g.lineTo(x2, y2); g.stroke();
    g.strokeStyle = 'rgba(255,230,250,.9)'; g.lineWidth = 2; g.stroke();
  }
  drawBoss(now);
  for (const j of jets) if (j.alive) drawJet(j, now);
  drawWeather(); // over the jets: a jet in a cloud is hidden in it
  for (const p of parts) {
    const k = clamp(p.life / p.max, 0, 1);
    if (p.kind === 'vapor') { g.strokeStyle = `rgba(220,245,255,${k * 0.8})`; g.lineWidth = 4; g.beginPath(); g.arc(p.x, p.y, p.r, 0, Math.PI * 2); g.stroke(); continue; }
    if (p.kind === 'ring') { g.strokeStyle = `rgba(255,220,150,${k})`; g.lineWidth = 3; g.beginPath(); g.arc(p.x, p.y, p.r, 0, Math.PI * 2); g.stroke(); continue; }
    g.fillStyle = p.kind === 'smoke' ? `rgba(70,70,70,${k * 0.6})` : `rgba(255,${120 + k * 120},40,${k})`;
    g.beginPath(); g.arc(p.x, p.y, p.r * (p.kind === 'smoke' ? 2 - k : 1), 0, Math.PI * 2); g.fill();
  }
  for (const f of floats) text(f.text, f.x, f.y, 20, f.color, 'center', 800);
  drawHud();
}

function drawHud() {
  // radio feed, bottom left
  // in the lobby the join panel takes the bottom: the feed sits above it so they don't overlap
  const feedY = phase === 'lobby' ? H - 40 - (teamsOn() ? (SHOW_HELP ? 300 : 232) : (SHOW_HELP ? 234 : 110)) - 30 : H - 60;
  feed.forEach((f, i) => { g.globalAlpha = clamp(f.life, 0, 1); text(f.text, 40, feedY - (feed.length - 1 - i) * 36, 24, f.color); });
  g.globalAlpha = 1;
  if (phase === 'lobby' && teamsOn()) {
    const n = roster.size, T = mode.teams;
    const w = 1000, x = (W - w) / 2, hh = SHOW_HELP ? 300 : 232, y = H - 40 - hh;
    panel(x, y, w, hh);
    text('공중전 · 팀전', x + 28, y + 34, 30, ACCENT, 'left', 900);
    const nextBoss = bossNext || (BOSS_EVERY && (roundNo + 1) % BOSS_EVERY === 0);
    text(n ? `${nextBoss ? '⚠ 보스전 ' : '출격'}까지 ${Math.ceil(lobbyLeft)}초  ·  조종사 ${n}명` : '조종사 대기 중', x + w - 28, y + 34, 24, nextBoss ? '#ff6b6b' : '#e8f6f4', 'right');
    const bw = (w - 56 - (T.length - 1) * 14) / T.length;
    T.forEach((t, i) => {
      const bx = x + 28 + i * (bw + 14), by = y + 62;
      g.fillStyle = 'rgba(255,255,255,.04)'; g.strokeStyle = t.color; g.lineWidth = 3;
      g.beginPath(); g.roundRect(bx, by, bw, 96, 12); g.fill(); g.stroke();
      const cnt = [...roster.values()].filter((r) => r.team === i).length;
      text(t.name, bx + bw / 2, by + 32, 28, t.color, 'center', 900);
      text(`!팀 ${i + 1}   ·   ${cnt}명`, bx + bw / 2, by + 70, 22, '#e8f6f4', 'center', 800);
    });
    text('채팅에  !팀 1 · !팀 2 …  (또는 팀 이름)  ·  !출격 은 사람이 적은 팀으로', x + 28, y + 190, 22, '#ffd34d', 'left', 800);
    if (SHOW_HELP) {
      cmdRow(x + 28, y + 232, [['!미사일', '미사일'], ['!플레어', '플레어'], ['!회피', '코브라'], ['!특수', '특수무기'], ['!귀환', '나가기']], 20);
      cmdRow(x + 28, y + 268, [['자동 조종', ''], ['!공격형', ''], ['!회피형', ''], ['!호위형', '팀원 지키기'], ['!기본형', '']], 20);
    }
  } else if (phase === 'lobby') {
    const n = roster.size;
    const w = 860, x = (W - w) / 2, hh = SHOW_HELP ? 234 : 110, y = H - 40 - hh;
    panel(x, y, w, hh);
    text('공중전', x + 28, y + 34, 30, ACCENT, 'left', 900);
    const nextBoss = bossNext || (BOSS_EVERY && (roundNo + 1) % BOSS_EVERY === 0);
    text(n ? `${nextBoss ? '⚠ 보스전 ' : '출격'}까지 ${Math.ceil(lobbyLeft)}초  ·  조종사 ${n}명` : '조종사 대기 중', x + w - 28, y + 34, 24, nextBoss ? '#ff6b6b' : '#e8f6f4', 'right');
    text('채팅에  !출격  을 입력해서 참전하세요', x + 28, y + 78, 24, '#ffd34d', 'left', 800);
    if (SHOW_HELP) {
      cmdRow(x + 28, y + 124, [['!미사일', '미사일'], ['!플레어', '플레어'], ['!회피', '코브라 기동'], ['!특수', '특수무기']]);
      cmdRow(x + 28, y + 162, [['!귀환', '나가기'], ['!시작', '바로 시작'], ['!보스', '보스전 예약'], ['', '(방송인·매니저)']]);
      cmdRow(x + 28, y + 200, [['자동 조종', ''], ['!공격형', ''], ['!회피형', '구름·태양으로'], ['!호위형', '반격'], ['!기본형', '']]);
    }
  } else if (phase === 'fight' && boss) {
    const alive = jets.filter((j) => j.alive).length;
    const left = Math.max(0, BOSS_LIMIT - roundT);
    const w = 900, x = W / 2 - w / 2;
    panel(x, 24, w, 76);
    text(BOSS_NAME, x + 24, 46, 24, '#ff6b6b', 'left', 900);
    text(`아군 ${alive} / ${jets.length}   ${Math.floor(left / 60)}:${String(Math.floor(left % 60)).padStart(2, '0')}`, x + w - 24, 46, 22, left < 15 ? '#ff5f5f' : '#e8f6f4', 'right', 800);
    g.fillStyle = 'rgba(0,0,0,.55)'; g.fillRect(x + 24, 68, w - 48, 16);
    g.fillStyle = boss.phase2 ? '#ff4d4d' : '#ff9f43'; g.fillRect(x + 24, 68, (w - 48) * clamp(boss.hp / boss.max, 0, 1), 16);
    if (SHOW_HELP) {
      const cw = 980;
      panel(W / 2 - cw / 2, 110, cw, 48);
      cmdRow(W / 2 - cw / 2 + 24, 134, [['!미사일', '미사일 7초'], ['!플레어', '플레어'], ['!회피', '코브라 (빔도 회피)'], ['!특수', `특수무기 ${SP_CD}초`]], 20);
    }
  } else if (phase === 'fight' && teamRound) {
    const al = teamAlive();
    const left = Math.max(0, TEAM_LIMIT - roundT);
    const w = 200 + mode.teams.length * 200, x = W / 2 - w / 2;
    panel(x, 24, w, 60);
    mode.teams.forEach((t, i) => { text(`${t.name} ${al[i]}`, x + 30 + i * 200, 54, 26, al[i] ? t.color : '#7b8b8a', 'left', 900); });
    text(`${Math.floor(left / 60)}:${String(Math.floor(left % 60)).padStart(2, '0')}`, x + w - 24, 54, 26, left < 10 ? '#ff5f5f' : ACCENT, 'right', 800);
    if (SHOW_HELP) {
      const cw = 980;
      panel(W / 2 - cw / 2, 96, cw, 48);
      cmdRow(W / 2 - cw / 2 + 24, 120, [['!미사일', '미사일 7초'], ['!플레어', '플레어'], ['!회피', '코브라'], ['!특수', `특수무기 ${SP_CD}초`]], 20);
    }
  } else if (phase === 'fight') {
    const alive = jets.filter((j) => j.alive).length;
    const left = Math.max(0, ROUND_LIMIT - roundT);
    panel(W / 2 - 260, 24, 520, 60);
    text(`생존 ${alive} / ${jets.length}`, W / 2 - 236, 54, 26, '#e8f6f4', 'left', 800);
    text(`${Math.floor(left / 60)}:${String(Math.floor(left % 60)).padStart(2, '0')}`, W / 2 + 236, 54, 26, left < 10 ? '#ff5f5f' : ACCENT, 'right', 800);
    if (SHOW_HELP) {
      const cw = 980;
      panel(W / 2 - cw / 2, 96, cw, 48);
      cmdRow(W / 2 - cw / 2 + 24, 120, [['!미사일', '미사일 7초'], ['!플레어', '플레어'], ['!회피', '코브라'], ['!특수', `특수무기 ${SP_CD}초`]], 20);
    }
  } else if (phase === 'result' && boss) {
    g.globalAlpha = clamp(phaseT * 2, 0, 1);
    panel(W / 2 - 440, H / 2 - 120, 880, 220);
    text(bossWon ? 'MISSION ACCOMPLISHED' : 'MISSION FAILED', W / 2, H / 2 - 60, 34, bossWon ? ACCENT : '#ff6b6b', 'center', 900);
    text(bossWon ? `${BOSS_NAME} 격파!` : `${BOSS_NAME} 이탈`, W / 2, H / 2 + 4, 52, '#e8f6f4', 'center', 900);
    if (winner) text(`MVP  ${winner.nick}  ·  피해 ${Math.round(winner.bossDmg)}`, W / 2, H / 2 + 66, 26, winner.human ? jetColor(winner, 72) : '#e8f6f4', 'center');
    g.globalAlpha = 1;
  } else if (phase === 'result' && teamRound && teamWin) {
    g.globalAlpha = clamp(phaseT * 2, 0, 1);
    const w = 960, h = 250, x = W / 2 - w / 2, y = H / 2 - 130;
    panel(x, y, w, h);
    g.strokeStyle = teamWin.color; g.lineWidth = 4; g.beginPath(); g.roundRect(x, y, w, h, 14); g.stroke();
    text('MISSION ACCOMPLISHED', W / 2, y + 44, 30, ACCENT, 'center', 900);
    text(`${teamWin.name} 승리!`, W / 2, y + 116, 72, teamWin.color, 'center', 900);
    text(teamStats.map((t) => `${t.name} 생존 ${t.alive}/${t.jets} · 격추 ${t.kills}`).join('    '), W / 2, y + 184, 22, '#e8f6f4', 'center');
    if (teamWin.tie) text('동점이라 추첨으로 정했어요', W / 2, y + 220, 20, '#9fb8b6', 'center');
    g.globalAlpha = 1;
  } else if (phase === 'result' && winner) {
    const a = clamp(phaseT * 2, 0, 1);
    g.globalAlpha = a;
    panel(W / 2 - 440, H / 2 - 120, 880, 220);
    text('MISSION ACCOMPLISHED', W / 2, H / 2 - 60, 34, ACCENT, 'center', 900);
    text(winner.nick, W / 2, H / 2 + 4, 64, winner.human ? jetColor(winner, 72) : '#ffb0b0', 'center', 900);
    text(`최후의 생존자  ·  격추 ${winner.kills}`, W / 2, H / 2 + 66, 26, '#e8f6f4', 'center');
    g.globalAlpha = 1;
  }
  if (SHOW_BOARD && board.length) {
    const x = W - 360, y = 24, h = 58 + board.length * 38;
    panel(x, y, 336, h);
    text('에이스 랭킹', x + 22, y + 30, 22, ACCENT, 'left', 900);
    text('승 · 격추', x + 314, y + 30, 16, '#9fb8b6', 'right');
    board.forEach((p, i) => {
      const yy = y + 70 + i * 38;
      text(`${i + 1}`, x + 26, yy, 22, i === 0 ? '#ffd34d' : '#9fb8b6', 'left', 900);
      text(p.nick.length > 10 ? p.nick.slice(0, 10) + '…' : p.nick, x + 56, yy, 22, '#e8f6f4', 'left');
      text(`${p.wins} · ${p.kills}`, x + 314, yy, 22, '#e8f6f4', 'right');
    });
  }
}

// "!명령 설명   !명령 설명 …" on one line, commands highlighted
function cmdRow(x, y, items, size = 22) {
  let cx = x;
  for (const [cmd, desc] of items) {
    g.font = `900 ${size}px ${FONT}`; const w1 = g.measureText(cmd).width;
    text(cmd, cx, y, size, '#ffd34d', 'left', 900);
    g.font = `700 ${size}px ${FONT}`; const w2 = g.measureText(desc).width;
    text(desc, cx + w1 + 8, y, size, '#e8f6f4', 'left', 700);
    cx += w1 + 8 + w2 + 26;
  }
}

// ---------- loop ----------
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  update(dt);
  draw(now / 1000);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ---------- chat link ----------
if (!DEMO || Q.get('live') === '1') {
  const es = new EventSource('/api/dogfight/events');
  // Xylem pack switched (patched mid-stream) → load the new page
  let packV = null;
  es.addEventListener('hello', (e) => { try { const v = JSON.parse(e.data).pack; if (packV && v !== packV) location.reload(); packV = v; } catch {} });
  es.addEventListener('reload', () => location.reload());
  es.addEventListener('cmd', (e) => { try { onCmd(JSON.parse(e.data)); } catch {} });
  es.addEventListener('board', (e) => { try { board = JSON.parse(e.data) || []; } catch {} });
  es.addEventListener('mode', (e) => { try { setMode(JSON.parse(e.data)); } catch {} });
}
if (DEMO) {
  const nt = Number(Q.get('team')) || 0;
  if (nt >= 2) setMode({ mode: 'team', teams: [{ name: '레드', color: '#ff5a5a' }, { name: '블루', color: '#4f9dff' }, { name: '옐로', color: '#ffd34d' }, { name: '그린', color: '#5be37d' }].slice(0, Math.min(4, nt)) });
  const fake = ['호시아', '별빛조종사', 'Cipher', '라면왕', '야간비행', '구름위'];
  let k = 0;
  setInterval(() => {
    if (phase === 'lobby' && k < fake.length && Math.random() < 0.6) { const n = fake[k++]; onCmd({ uid: `demo:${n}`, nick: n, text: '!출격' }); if (Math.random() < 0.5) onCmd({ uid: `demo:${n}`, nick: n, text: ['!공격형', '!회피형', '!호위형'][k % 3] }); }
    if (phase === 'fight') {
      const humans = [...roster.values()];
      const p = humans[Math.floor(Math.random() * humans.length)];
      if (p) { const r = Math.random(); onCmd({ uid: p.uid, nick: p.nick, text: r < 0.45 ? '!미사일' : r < 0.6 ? '!플레어' : r < 0.8 ? '!회피' : '!특수' }); }
    }
  }, 1500);
}
</script>
